# Projet Supabase dédié à l'app mobile "Mon Bento Pop".
# Séparé du projet landing (`/supabase/` au root) pour isoler les données
# communautaires (millions de bentos potentiels) des données plateau.
#
# Pour linker au projet distant (depuis la racine du monorepo) :
#   cd apps/mobile
#   supabase link --project-ref <project-ref>
#   supabase db push

project_id = "bento-pop-mobile"

[api]
enabled = true
port = 54331
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54332
shadow_port = 54330
major_version = 17

[studio]
enabled = true
port = 54333

[auth]
enabled = true
# Anonymous sign-in : essentiel pour le modèle MVP (pas d'email obligatoire).
# Chaque 1er lancement de l'app crée un auth.users anonyme dont l'uid sert
# de pivot RLS. Chantier 28 : on garde son compte en y rattachant une adresse
# email, vérifiée par un code (`updateUser({ email })` puis `verifyOtp`).
# L'uid est préservé, donc les bentos et le pseudo restent liés.
enable_anonymous_sign_ins = true
enable_signup = true

[auth.rate_limit]
# Comptes anonymes créés par heure et par adresse IP, 30 par défaut. En local,
# tout vient de 127.0.0.1 : les contrôles du chantier 28 en créent une dizaine
# à chaque passage, la recette un par réinstallation.
anonymous_users = 300
# Connexions et inscriptions par 5 minutes et par adresse IP, 30 par défaut :
# les contrôles du chantier 22 connectent quatre comptes gardés à chaque
# passage, et le lot 1 en enchaîne une dizaine, défauts introduits compris.
sign_in_sign_ups = 300

[auth.email]
enable_signup = true
# Chantier 28, D7 : une adresse ne se rattache qu'une fois vérifiée par son
# code. Éteinte, la confirmation rattachait l'adresse sur-le-champ : n'importe
# qui aurait pu prendre celle d'un autre. En production, le réglage « Confirm
# email » de « My Bento Pop ».
enable_confirmations = true
double_confirm_changes = true
otp_length = 6
otp_expiry = 3600
max_frequency = "60s"

# Les deux mails du chantier 28 (D12) : garder son compte, puis se
# reconnecter. Le code seul, sans lien ni promotion.
[auth.email.template.email_change]
subject = "Ton code pour garder ton compte"
content_path = "./supabase/templates/garder-mon-compte.html"

[auth.email.template.magic_link]
subject = "Ton code pour te reconnecter"
content_path = "./supabase/templates/reconnexion.html"

[inbucket]
# Mailpit reçoit en local tous les mails de l'authentification : rien ne part.
# Sur 54334 et non 54324, la série du projet « lokkal ».
enabled = true
port = 54334

[storage]
# Activé pour héberger les illustrations du catalogue maison
# (`item-images/{itemId}/main.{ext}`). Sourcing depuis Wikipedia +
# upload manuel admin via le BO. Cf. migration `20260531000000_item_images_storage.sql`.
enabled = true
