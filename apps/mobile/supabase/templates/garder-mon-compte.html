<!-- Chantier 28, D12 : le mail qui garde un compte. Le code seul, sans lien ni
     promotion, pour rester un mail d'authentification aux yeux des filtres.
     Même texte dans le modèle « Change Email Address » de « My Bento Pop ». -->
<div style="font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #0a0a0a; max-width: 480px;">
  <p style="font-size: 16px; line-height: 1.5;">Voici ton code pour garder ton compte Mon Bento Pop. Saisis-le dans l'app :</p>
  <p style="font-size: 32px; font-weight: 700; letter-spacing: 6px; margin: 24px 0;">{{ .Token }}</p>
  <p style="font-size: 14px; line-height: 1.5; color: #555555;">Il est valable une heure. Si tu n'as rien demandé, ignore ce mail : rien ne change.</p>
</div>
