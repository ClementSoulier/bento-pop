<!-- Chantier 28, D12 : le mail qui reconnecte un compte gardé, sur un autre
     téléphone ou après une réinstallation. Le code seul, sans lien ni
     promotion. Même texte dans le modèle « Magic Link » de « My Bento Pop ». -->
<div style="font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #0a0a0a; max-width: 480px;">
  <p style="font-size: 16px; line-height: 1.5;">Voici ton code pour te reconnecter à ton compte Mon Bento Pop. Saisis-le dans l'app :</p>
  <p style="font-size: 32px; font-weight: 700; letter-spacing: 6px; margin: 24px 0;">{{ .Token }}</p>
  <p style="font-size: 14px; line-height: 1.5; color: #555555;">Il est valable une heure. Si tu n'as rien demandé, ignore ce mail : personne n'entre dans ton compte sans ce code.</p>
</div>
